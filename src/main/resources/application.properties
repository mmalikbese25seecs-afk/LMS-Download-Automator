# Server
server.port=8080

# App identity
spring.application.name=NUST LMS Automator

# File upload limits:
# PDFBox summarizer accepts up to 20MB. Spring needs both settings.
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

# Logging:
# INFO hides verbose Spring startup noise
# DEBUG level for our own package so we see [CalendarService] etc.
logging.level.root=WARN
logging.level.com.downloadc=DEBUG
logging.level.org.springframework.web=INFO

# Jackson (JSON serializer)
# Don't fail if a field in the JSON has no matching Java property
spring.jackson.deserialization.fail-on-unknown-properties=false
# Don't serialize null fields, keeps JSON responses clean
spring.jackson.default-property-inclusion=non_null

# Static resources:
# Spring Boot serves everything in /static/ automatically.
# This line is not required but makes the intent explicit.
spring.web.resources.static-locations=classpath:/static/

# Session:
# How long before an idle session expires (30 minutes)
server.servlet.session.timeout=30m

# Error handling:
# Disable the default Whitelabel error page — our GlobalExceptionHandler
# catches everything and returns clean JSON instead
server.error.whitelabel.enabled=false
