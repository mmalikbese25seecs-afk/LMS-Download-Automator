# Server:
server.port=8080
spring.application.name=LMS Automator

# File upload limits:
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB

# Logging:
logging.level.root=INFO
logging.level.com.downloadc=DEBUG

# Scheduling:
# Enables @Scheduled in SchedulerService (auto-sync daily/weekly)
spring.task.scheduling.pool.size=2

# Google Drive:
# Place your OAuth credentials JSON from Google Cloud Console here:
google.drive.credentials.path=src/main/resources/credentials.json
# Folder where OAuth tokens are cached after first login:
google.drive.tokens.dir=tokens

# Gemini AI Summarizer:
# Get your key from https://aistudio.google.com/app/apikey
gemini.api.key=YOUR_GEMINI_API_KEY_HERE