# ── Server ─────────────────────────────
server.port=8080
spring.application.name=LMS Automator

# ── Upload Limits (safe for PDFs) ──────
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# ── Logging ────────────────────────────
logging.level.root=INFO
logging.level.com.downloadc=DEBUG
logging.level.org.springframework.web=DEBUG

# ── Scheduling ─────────────────────────
spring.task.scheduling.enabled=true
spring.task.scheduling.pool.size=2

# ── Session ────────────────────────────
server.servlet.session.timeout=60m

# ── Google Drive ───────────────────────
google.drive.credentials.path=src/main/resources/credentials.json
google.drive.tokens.dir=src/main/resources/tokens

# ── Gemini AI ──────────────────────────
gemini.api.key=YOUR_GEMINI_API_KEY_HERE

# ── CORS (only if using separate frontend dev server)
# spring.web.cors.allowed-origins=http://localhost:5500