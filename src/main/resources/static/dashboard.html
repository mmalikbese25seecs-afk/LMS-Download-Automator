<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>
        NUST LMS — Dashboard
    </title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root{--bg:#0b0d15;--surface:#10121d;--card:#161929;--border:#222640;--accent:#4f8ef7;--glow:rgba(79,142,247,0.18);--red:#e74c3c;--orange:#e67e22;--green:#2dd4bf;--purple:#a78bfa;--yellow:#f59e0b;--muted:#5a6080;--font:'DM Sans',sans-serif;--mono:'JetBrains Mono',monospace}
        *{box-sizing:border-box}
        body{font-family:var(--font);background:var(--bg);color:#dde1f0;min-height:100vh}
        .topnav{background:var(--surface);border-bottom:1px solid var(--border);height:58px;position:sticky;top:0;z-index:1030}
        .nav-brand{font-size:1.05rem;font-weight:800;color:#dde1f0;text-decoration:none}
        .nav-brand span{color:var(--accent)}
        .nav-pill{padding:5px 14px;border-radius:8px;font-size:.84rem;color:var(--muted);text-decoration:none;border:1px solid transparent;transition:all .15s;font-weight:500}
        .nav-pill:hover{background:var(--card);color:#dde1f0;border-color:var(--border)}
        .nav-pill.active{background:var(--accent);color:#fff;border-color:var(--accent)}
        .user-avatar{width:32px;height:32px;border-radius:50%;background:var(--accent);font-size:.82rem;font-weight:800;color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0}
        .btn-logout{background:transparent;border:1px solid var(--border);color:var(--muted);font-size:.8rem;padding:4px 12px;border-radius:7px;transition:all .15s;cursor:pointer;font-family:var(--font)}
        .btn-logout:hover{border-color:var(--red);color:var(--red)}
        .page-wrap{max-width:1280px;margin:0 auto;padding:28px 20px}
        .stat-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:20px 22px;transition:transform .15s,box-shadow .15s}
        .stat-card:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.3)}
        .stat-label{font-size:.72rem;font-weight:600;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
        .stat-value{font-size:2.2rem;font-weight:800;line-height:1;font-family:var(--mono)}
        .stat-sub{font-size:.76rem;color:var(--muted);margin-top:5px}
        .val-blue{color:var(--accent)}
        .val-red{color:var(--red)}
        .val-green{color:var(--green)}
        .val-purple{color:var(--purple)}
        .section-card{background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden}
        .section-head{padding:14px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
        .section-head h2{font-size:.92rem;font-weight:700;margin:0}
        .head-badge{font-size:.72rem;background:var(--surface);border:1px solid var(--border);color:var(--muted);padding:3px 10px;border-radius:20px;font-weight:500}
        .course-row{border-bottom:1px solid var(--border);transition:background .12s;cursor:pointer}
        .course-row:last-child{border-bottom:none}
        .course-row.is-fav{border-left:3px solid var(--yellow)}
        .course-header{padding:12px 18px;display:flex;align-items:center;gap:10px;user-select:none}
        .course-header:hover{background:rgba(79,142,247,.05)}
        .course-chevron{color:var(--muted);font-size:.75rem;transition:transform .2s;flex-shrink:0}
        .course-name{font-size:.88rem;font-weight:600;color:#dde1f0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
        .course-meta{font-size:.72rem;color:var(--muted);margin-top:2px;display:flex;gap:10px;flex-wrap:wrap}
        .course-meta i{font-size:.75rem}
        .new-badge{font-size:.68rem;font-weight:800;background:var(--red);color:#fff;border-radius:10px;padding:2px 7px;flex-shrink:0}
        .btn-star{background:transparent;border:none;cursor:pointer;font-size:1rem;padding:0 2px;transition:transform .15s;flex-shrink:0}
        .btn-star:hover{transform:scale(1.25)}
        .btn-star.starred{color:var(--yellow)}
        .btn-star.unstarred{color:var(--muted)}
        .course-actions{display:flex;gap:6px;flex-wrap:wrap;align-items:center;flex-shrink:0;margin-left:auto}
        .course-panel{display:none;border-top:1px solid var(--border);background:rgba(0,0,0,.15)}
        .course-panel.open{display:block}
        .quick-actions{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:28px}
        .action-btn{display:inline-flex;align-items:center;gap:7px;padding:9px 16px;border-radius:9px;border:1px solid var(--border);background:var(--card);color:#dde1f0;text-decoration:none;font-size:.84rem;font-weight:500;cursor:pointer;transition:all .15s;font-family:var(--font)}
        .action-btn:hover{border-color:var(--accent);color:var(--accent);background:var(--glow)}
        .btn-sm-act{display:inline-flex;align-items:center;gap:5px;padding:5px 11px;border-radius:7px;font-size:.77rem;font-weight:600;cursor:pointer;border:1px solid var(--border);background:var(--surface);color:#dde1f0;transition:all .15s;font-family:var(--font);white-space:nowrap}
        .btn-sm-act:hover{border-color:var(--accent);color:var(--accent);background:var(--glow)}
        .btn-sm-act.primary{background:var(--accent);border-color:var(--accent);color:#fff}
        .btn-sm-act.primary:hover{background:#3a7be0;color:#fff}
        .empty-msg{padding:22px;text-align:center;color:var(--muted);font-size:.84rem}
        .spinner-ring{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite}
        @keyframes spin{to{transform:rotate(360deg)}}
        .center-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60vh;gap:14px;color:var(--muted)}
        .toast-custom{position:fixed;bottom:24px;right:24px;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:13px 18px;font-size:.85rem;color:#dde1f0;max-width:340px;z-index:9999;opacity:0;transform:translateY(10px);transition:all .25s;pointer-events:none;font-family:var(--font)}
        .toast-custom.show{opacity:1;transform:translateY(0)}
    </style>
</head>
<body>
<nav class="topnav d-flex align-items-center px-4 gap-3">
    <a class="nav-brand me-3" href="/dashboard.html">NUST <span>LMS</span></a>
    <div class="d-flex gap-1 nav-links">
        <a href="/dashboard.html" class="nav-pill active">🏠 Dashboard</a>
        <a href="/calendar.html" class="nav-pill">📅 Calendar</a>
        <a href="/files.html" class="nav-pill">📂 Files</a>
        <a href="/summarizer.html" class="nav-pill">🤖 Summarizer</a>
    </div>
    <div class="d-flex align-items-center gap-2 ms-auto">
        <div class="user-avatar" id="avatarLetter">?</div>
        <span class="d-none d-sm-inline" style="font-size:.83rem;color:var(--muted)" id="navUserName"></span>
        <button class="btn-logout" onclick="logout()">Logout</button>
    </div>
</nav>

<div class="page-wrap" id="pageContent">
    <div class="center-screen"><div class="spinner-ring"></div><p style="font-size:.88rem">Loading...</p></div>
</div>

<div class="toast-custom" id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/course-nav.js"></script>
<script>
    let dashData = {}, saveOpt = 'device';

    document.addEventListener('DOMContentLoaded', async () => {
        try {
            const r = await fetch('/api/auth/status');
            if (!(await r.json()).loggedIn) {
                window.location.href = '/index.html';
                return;
            }
        } catch {
            window.location.href = '/index.html';
            return;
        }
        const d = await fetchDash();
        if (d) renderPage(d);
    });

    async function fetchDash() {
        try {
            const r = await fetch('/api/dashboard/summary');
            if (r.status === 401) {
                window.location.href = '/index.html';
                return null;
            }
            if (!r.ok) {
                showErr((await r.json()).error || 'Failed');
                return null;
            }
            dashData = await r.json();
            return dashData;
        } catch (e) {
            showErr(e.message);
            return null;
        }
    }

    function renderPage(data) {
        const localUser = JSON.parse(localStorage.getItem('lmsUser'));
        const fullName = data.fullName || localUser?.fullName || "User";

        document.getElementById('navUserName').textContent = fullName;
        document.getElementById('avatarLetter').textContent = data.fullName.charAt(0).toUpperCase();
        const fn = data.fullName.split(' ')[0], uc = data.urgentCount, ec = data.upcomingEvents.length, qc = data.upcomingEvents.filter(e => e.eventType === 'quiz').length;
        const sorted = [...data.courses].sort((a, b) => {
            if (a.favorite && !b.favorite) return -1;
            if (!a.favorite && b.favorite) return 1;
            return a.fullName.localeCompare(b.fullName);
        });

        document.getElementById('pageContent').innerHTML = `
    <div class="mb-3 d-flex align-items-center justify-content-between flex-wrap gap-2">
        <div><h1 style="font-size:1.45rem;font-weight:800;margin:0">Good day, ${safe(fn)} 👋</h1><p style="font-size:.88rem;color:var(--muted);margin:4px 0 0">Your academic overview.</p></div>
    </div>
    ${uc > 0 ? `<div class="urgent-banner mb-3" style="background:rgba(231,76,60,.08);border:1px solid rgba(231,76,60,.28);border-radius:10px;padding:12px 18px;color:#f87171;font-size:.86rem;display:flex;align-items:center;gap:10px"><i class="bi bi-exclamation-triangle-fill fs-5"></i><span>You have <strong>${uc}</strong> deadline${uc > 1 ? 's' : ''} due within 3 days.</span></div>` : ''}
    <div class="row g-3 mb-4">
        <div class="col-6 col-md-3"><div class="stat-card"><div class="stat-label">Enrolled Courses</div><div class="stat-value val-blue">${data.courses.length}</div><div class="stat-sub">${safe(data.siteName)}</div></div></div>
        <div class="col-6 col-md-3"><div class="stat-card"><div class="stat-label">Urgent Deadlines</div><div class="stat-value val-red">${uc}</div><div class="stat-sub">Due within 3 days</div></div></div>
        <div class="col-6 col-md-3"><div class="stat-card"><div class="stat-label">Upcoming Events</div><div class="stat-value val-green">${ec}</div><div class="stat-sub">Next 14 days</div></div></div>
        <div class="col-6 col-md-3"><div class="stat-card"><div class="stat-label">Quizzes Ahead</div><div class="stat-value val-purple">${qc}</div><div class="stat-sub">Next 14 days</div></div></div>
    </div>
    <div class="quick-actions">
        <a href="/calendar.html" class="action-btn">📅 Calendar</a>
        <a href="/files.html" class="action-btn">📂 File Manager</a>
        <a href="/summarizer.html" class="action-btn">🤖 Summarizer</a>
    </div>
    <div class="row g-4">
        <div class="col-12">
            <div class="section-card">
                <div class="section-head"><h2><i class="bi bi-journals me-2"></i>Enrolled Courses</h2><span class="head-badge">${data.courses.length} courses</span></div>
                <div id="courseList">${sorted.length ? sorted.map(c => buildCRow(c)).join('') : '<div class="empty-msg">No enrolled courses found.</div>'}</div>
            </div>
        </div>
    </div>`;
    }

    function buildCRow(c) {
        const nb = c.newFilesCount > 0 ? `<span class="new-badge">🔴 ${c.newFilesCount} new</span>` : '';
        const ins = c.instructorName ? `<span><i class="bi bi-person-fill"></i> ${safe(c.instructorName)}</span>` : '';
        return `<div class="course-row${c.favorite ? ' is-fav' : ''}" id="cr-${c.id}">
    <div class="course-header" onclick="navigateToCourse(${c.id},'${safe(c.shortName)}','${safe(c.fullName)}')">
        <i class="bi bi-chevron-right course-chevron" id="chev-${c.id}"></i>
        <div style="flex:1;min-width:0"><div class="course-name">${safe(c.fullName)}</div><div class="course-meta">${ins}</div></div>
        ${nb}
        <button class="btn-star ${c.favorite ? 'starred' : 'unstarred'}" id="star-${c.id}" onclick="event.stopPropagation();togFav(${c.id},this)" title="${c.favorite ? 'Unpin' : 'Pin to top'}">${c.favorite ? '⭐' : '☆'}</button>
    </div>
</div>`;
    }

    async function togFav(id, btn) {
        const isFav = btn.classList.contains('starred');
        await fetch(`/api/favorites/${id}`, { method: isFav ? 'DELETE' : 'POST' });
        btn.classList.toggle('starred', !isFav);
        btn.classList.toggle('unstarred', isFav);
        btn.textContent = isFav ? '☆' : '⭐';
        document.getElementById('cr-' + id)?.classList.toggle('is-fav', !isFav);
        showToast(isFav ? 'Course unpinned.' : 'Course pinned ⭐');
    }

    function safe(s) {
        if (!s) return '';
        return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    function showErr(m) {
        document.getElementById('pageContent').innerHTML = `<div class="center-screen"><i class="bi bi-exclamation-circle" style="font-size:2rem;color:var(--red)"></i><p style="color:var(--red)">${safe(m)}</p><button class="btn-sm-act primary" onclick="location.reload()">Retry</button></div>`;
    }

    let _t;
    function showToast(m, e = false) {
        const el = document.getElementById('toast');
        el.textContent = m;
        el.style.borderColor = e ? 'var(--red)' : 'var(--border)';
        el.classList.add('show');
        clearTimeout(_t);
        _t = setTimeout(() => el.classList.remove('show'), 3800);
    }

    async function logout() {
        await fetch('/api/auth/logout', { method: 'POST' });
        window.location.href = '/index.html';
    }
</script>
</body>
</html>
