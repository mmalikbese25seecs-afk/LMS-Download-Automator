<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>
        NUST LMS — Dashboard
    </title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --bs-body-bg:    #0b0d15;
            --bs-body-color: #dde1f0;
            --surface:       #10121d;
            --card-bg:       #161929;
            --border-color:  #222640;
            --accent:        #4f8ef7;
            --accent-glow:   rgba(79,142,247,0.18);
            --red:           #e74c3c;
            --orange:        #e67e22;
            --green:         #2dd4bf;
            --purple:        #a78bfa;
            --muted:         #5a6080;
            --font-main:     'DM Sans', sans-serif;
            --font-mono:     'JetBrains Mono', monospace;
        }

        * {
            box-sizing: border-box;
        }
        body {
            font-family: var(--font-main); background: var(--bs-body-bg); color: var(--bs-body-color); min-height: 100vh;
        }

        /* ── Navbar ── */
        .topnav {
            background: var(--surface); border-bottom: 1px solid var(--border-color); height: 58px; position: sticky; top: 0; z-index: 1030;
        }
        .nav-brand {
            font-size: 1.05rem; font-weight: 800; letter-spacing: 0.3px; color: var(--bs-body-color); text-decoration: none;
        }
        .nav-brand span {
            color: var(--accent);
        }
        .nav-pill {
            padding: 5px 14px; border-radius: 8px; font-size: 0.84rem; color: var(--muted); text-decoration: none; border: 1px solid transparent; transition: all 0.15s; font-weight: 500;
        }
        .nav-pill:hover {
            background: var(--card-bg); color: var(--bs-body-color); border-color: var(--border-color);
        }
        .nav-pill.active {
            background: var(--accent); color: #fff; border-color: var(--accent);
        }
        .user-avatar {
            width: 32px; height: 32px; border-radius: 50%; background: var(--accent); font-size: 0.82rem; font-weight: 800; color: #fff; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
        }
        .btn-logout {
            background: transparent; border: 1px solid var(--border-color); color: var(--muted); font-size: 0.8rem; padding: 4px 12px; border-radius: 7px; transition: all 0.15s; font-family: var(--font-main); cursor: pointer;
        }
        .btn-logout:hover {
            border-color: var(--red); color: var(--red); background: rgba(231,76,60,0.07);
        }

        /* ── Layout ── */
        .page-wrap {
            max-width: 1240px; margin: 0 auto; padding: 28px 20px;
        }

        /* ── Stat Cards ── */
        .stat-card {
            background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 14px; padding: 20px 22px; transition: transform 0.15s, box-shadow 0.15s;
        }
        .stat-card:hover {
            transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,0.3);
        }
        .stat-label {
            font-size: 0.72rem; font-weight: 600; letter-spacing: 0.8px; text-transform: uppercase; color: var(--muted); margin-bottom: 6px;
        }
        .stat-value {
            font-size: 2.2rem; font-weight: 800; line-height: 1; font-family: var(--font-mono);
        }
        .stat-sub {
            font-size: 0.76rem; color: var(--muted); margin-top: 5px;
        }
        .val-blue   {
            color: var(--accent);
        }
        .val-red    {
            color: var(--red);
        }
        .val-green  {
            color: var(--green);
        }
        .val-purple {
            color: var(--purple);
        }

        /* ── Section Card ── */
        .section-card {
            background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 14px; overflow: hidden;
        }
        .section-head {
            padding: 14px 20px; border-bottom: 1px solid var(--border-color); display: flex; align-items: center; justify-content: space-between;
        }
        .section-head h2 {
            font-size: 0.92rem; font-weight: 700; margin: 0;
        }
        .head-badge {
            font-size: 0.72rem; background: var(--surface); border: 1px solid var(--border-color); color: var(--muted); padding: 3px 10px; border-radius: 20px; font-weight: 500;
        }

        /* ── Course Row ── */
        .course-row {
            border-bottom: 1px solid var(--border-color); transition: background 0.12s;
        }
        .course-row:last-child {
            border-bottom: none;
        }
        .course-header {
            padding: 13px 20px; display: flex; align-items: center; justify-content: space-between; gap: 12px; cursor: pointer; user-select: none;
        }
        .course-header:hover {
            background: rgba(79,142,247,0.05);
        }
        .course-chevron {
            color: var(--muted); font-size: 0.75rem; transition: transform 0.2s; flex-shrink: 0;
        }
        .course-chevron.open {
            transform: rotate(90deg);
        }
        .course-name {
            font-size: 0.88rem; font-weight: 600; color: var(--bs-body-color);
        }
        .course-code {
            font-size: 0.73rem; color: var(--muted); margin-top: 2px; font-family: var(--font-mono);
        }

        /* ── Course Actions Row ── */
        .course-actions {
            display: flex; gap: 6px; flex-wrap: wrap; align-items: center; flex-shrink: 0;
        }

        /* ── Expanded Course Panel ── */
        .course-panel {
            display: none; border-top: 1px solid var(--border-color); background: rgba(0,0,0,0.15); padding: 0;
        }
        .course-panel.open {
            display: block;
        }

        /* ── Week Tabs ── */
        .week-tabs {
            display: flex; gap: 0; overflow-x: auto; border-bottom: 1px solid var(--border-color); padding: 0 16px; scrollbar-width: thin;
        }
        .week-tab {
            padding: 10px 14px; font-size: 0.78rem; font-weight: 600; color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; white-space: nowrap; transition: all 0.15s; flex-shrink: 0;
        }
        .week-tab:hover {
            color: var(--bs-body-color);
        }
        .week-tab.active {
            color: var(--accent); border-bottom-color: var(--accent);
        }
        .week-tab.has-files::after {
            content: ''; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); margin-left: 6px; vertical-align: middle;
        }

        /* ── File List ── */
        .file-list {
            padding: 12px 16px;
        }
        .file-item {
            display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; transition: background 0.12s;
        }
        .file-item:hover {
            background: rgba(255,255,255,0.04);
        }
        .file-icon {
            width: 28px; height: 28px; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 0.9rem; flex-shrink: 0;
        }
        .file-name {
            font-size: 0.82rem; font-weight: 500; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        .file-size {
            font-size: 0.72rem; color: var(--muted); font-family: var(--font-mono); flex-shrink: 0;
        }
        .file-drive-badge {
            font-size: 0.68rem; background: rgba(45,212,191,0.15); color: var(--green); border: 1px solid rgba(45,212,191,0.3); padding: 2px 7px; border-radius: 10px; flex-shrink: 0;
        }

        /* ── Panel Toolbar ── */
        .panel-toolbar {
            padding: 10px 16px; display: flex; align-items: center; justify-content: space-between; gap: 10px; border-bottom: 1px solid var(--border-color); flex-wrap: wrap;
        }
        .toolbar-left {
            display: flex; gap: 7px; flex-wrap: wrap;
        }

        /* ── Buttons ── */
        .btn-sm-action {
            display: inline-flex; align-items: center; gap: 5px; padding: 5px 12px; border-radius: 7px; font-size: 0.78rem; font-weight: 600; cursor: pointer; border: 1px solid var(--border-color); background: var(--surface); color: var(--bs-body-color); transition: all 0.15s; font-family: var(--font-main); white-space: nowrap;
        }
        .btn-sm-action:hover {
            border-color: var(--accent); color: var(--accent); background: var(--accent-glow);
        }
        .btn-sm-action:disabled {
            opacity: 0.45; cursor: not-allowed; pointer-events: none;
        }
        .btn-sm-action.primary {
            background: var(--accent); border-color: var(--accent); color: #fff;
        }
        .btn-sm-action.primary:hover {
            background: #3a7be0; border-color: #3a7be0; color: #fff;
        }
        .btn-sm-action.success {
            background: var(--green); border-color: var(--green); color: #0b0d15;
        }
        .btn-sm-action.drive {
            background: rgba(255,255,255,0.06); border-color: #4285F4; color: #8ab4f8;
        }
        .btn-sm-action.drive:hover {
            background: rgba(66,133,244,0.12); color: #fff;
        }

        /* ── Drive Status Banner ── */
        .drive-banner {
            background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 14px 18px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
        }
        .drive-dot {
            width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
        }
        .drive-dot.connected {
            background: var(--green); box-shadow: 0 0 6px var(--green);
        }
        .drive-dot.disconnected {
            background: var(--muted);
        }
        .drive-dot.unconfigured {
            background: var(--orange);
        }

        /* ── Quick Actions ── */
        .quick-actions {
            display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 28px;
        }
        .action-btn {
            display: inline-flex; align-items: center; gap: 7px; padding: 9px 16px; border-radius: 9px; border: 1px solid var(--border-color); background: var(--card-bg); color: var(--bs-body-color); text-decoration: none; font-size: 0.84rem; font-weight: 500; cursor: pointer; transition: all 0.15s; font-family: var(--font-main);
        }
        .action-btn:hover {
            border-color: var(--accent); color: var(--accent); background: var(--accent-glow);
        }

        /* ── Deadline Items ── */
        .deadline-item {
            padding: 12px 18px; border-bottom: 1px solid var(--border-color); display: flex; gap: 11px; align-items: flex-start;
        }
        .deadline-item:last-child {
            border-bottom: none;
        }
        .dl-dot {
            width: 9px; height: 9px; border-radius: 50%; margin-top: 5px; flex-shrink: 0;
        }
        .dl-title {
            font-size: 0.85rem; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        .dl-course {
            font-size: 0.73rem; color: var(--muted); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        .dl-when {
            font-size: 0.72rem; font-weight: 700; white-space: nowrap; flex-shrink: 0; padding: 3px 9px; border-radius: 12px; color: #fff; font-family: var(--font-mono);
        }

        /* ── Misc ── */
        .urgent-banner {
            background: rgba(231,76,60,0.08); border: 1px solid rgba(231,76,60,0.28); border-radius: 10px; padding: 12px 18px; color: #f87171; font-size: 0.86rem; display: flex; align-items: center; gap: 10px;
        }
        .empty-msg {
            padding: 24px 20px; text-align: center; color: var(--muted); font-size: 0.84rem;
        }
        .loading-row {
            padding: 20px; text-align: center; color: var(--muted); font-size: 0.82rem;
        }
        .center-screen {
            display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 60vh; gap: 14px; color: var(--muted);
        }
        .spinner-ring {
            width: 36px; height: 36px; border: 3px solid var(--border-color); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.7s linear infinite;
        }
        .spinner-sm {
            width: 14px; height: 14px; border: 2px solid rgba(255,255,255,0.3); border-top-color: #fff; border-radius: 50%; animation: spin 0.7s linear infinite; display: inline-block;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
        .toast-custom {
            position: fixed; bottom: 24px; right: 24px; background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 10px; padding: 13px 18px; font-size: 0.85rem; color: var(--bs-body-color); max-width: 320px; z-index: 9999; opacity: 0; transform: translateY(10px); transition: all 0.25s; pointer-events: none; font-family: var(--font-main);
        }
        .toast-custom.show {
            opacity: 1; transform: translateY(0);
        }

        /* ── File type colours ── */
        .icon-pdf  {
            background: rgba(231,76,60,0.15);  color: #e74c3c;
        }
        .icon-pptx {
            background: rgba(230,126,34,0.15); color: #e67e22;
        }
        .icon-docx {
            background: rgba(79,142,247,0.15); color: #4f8ef7;
        }
        .icon-zip  {
            background: rgba(167,139,250,0.15);color: #a78bfa;
        }
        .icon-mp4  {
            background: rgba(45,212,191,0.15); color: #2dd4bf;
        }
        .icon-xlsx {
            background: rgba(45,212,191,0.15); color: #2dd4bf;
        }
        .icon-file {
            background: rgba(90,96,128,0.2);   color: var(--muted);
        }

        @media (max-width: 768px) {
            .topnav .nav-links {
                display: none;
            }
            .page-wrap {
                padding: 16px 12px;
            }
            .course-actions {
                gap: 4px;
            }
        }
    </style>
</head>
<body>

<!-- Navbar -->
<nav
        class="topnav d-flex align-items-center px-4 gap-3">
    <a
            class="nav-brand me-3" href="/dashboard.html">NUST
        <span>
        LMS
    </span>
    </a>
    <div
            class="d-flex gap-1 nav-links">
        <a
                href="/dashboard.html"  class="nav-pill active">🏠 Dashboard
        </a>
        <a
                href="/calendar.html"   class="nav-pill">📅 Calendar
        </a>
        <a
                href="/summarizer.html" class="nav-pill">🤖 Summarizer
        </a>
    </div>
    <div
            class="d-flex align-items-center gap-2 ms-auto">
        <div
                class="user-avatar" id="avatarLetter">?
        </div>
        <span
                class="d-none d-sm-inline" style="font-size:0.83rem;color:var(--muted)" id="navUserName">Loading...
        </span>
        <button
                class="btn-logout" onclick="logout()">Logout
        </button>
    </div>
</nav>

<!-- Page -->
<div
        class="page-wrap" id="pageContent">
    <div
            class="center-screen">
        <div
                class="spinner-ring">
        </div>
        <p
                style="font-size:0.88rem">Loading your Dashboard...
        </p>
    </div>
</div>

<div
        class="toast-custom" id="toast">
</div>

<script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
</script>
<script>

    //  State
    let dashData      = null;   // dashboard summary from API
    let driveStatus   = {
        configured: false, authorized: false
    };
    // courseState[courseId] = { open, filesLoaded, weeksLoaded, activeWeek, files, weeks }
    const courseState = {};

    //  Bootstrap
    document.addEventListener('DOMContentLoaded', async () => {
        try {
            const r = await fetch('/api/auth/status');
            const d = await r.json();
            if (!d.loggedIn) {
                window.location.href = '/index.html'; return;
            }
        } catch {
            window.location.href = '/index.html'; return;
        }

        // Load drive status and dashboard in parallel
        const [, dash] = await Promise.all([loadDriveStatus(), fetchDashboard()]);
        if (dash) renderPage(dash);
    });

    async function fetchDashboard() {
        try {
            const r = await fetch('/api/dashboard/summary');
            if (r.status === 401) {
                window.location.href = '/index.html'; return null;
            }
            if (!r.ok) {
                const e = await r.json(); showError(e.error || 'Failed to load.'); return null;
            }
            dashData = await r.json();
            return dashData;
        } catch (e) {
            showError('Connection error: ' + e.message); return null;
        }
    }

    async function loadDriveStatus() {
        try {
            const r = await fetch('/api/drive/status');
            if (r.ok) driveStatus = await r.json();
        } catch {
            /* Drive is optional */
        }
    }

    //  Main Render
    function renderPage(data) {
        document.getElementById('navUserName').textContent  = data.fullName;
        document.getElementById('avatarLetter').textContent = data.fullName.charAt(0).toUpperCase();

        const firstName   = data.fullName.split(' ')[0];
        const urgentCount = data.urgentCount;
        const eventCount  = data.upcomingEvents.length;
        const quizCount   = data.upcomingEvents.filter(e => e.eventType === 'quiz').length;
        const courseCount = data.courses.length;

        document.getElementById('pageContent').innerHTML = `
        <div
         class="mb-3 d-flex align-items-center justify-content-between flex-wrap gap-2">
            <div>
                <h1
                 style="font-size:1.45rem;font-weight:800;margin:0">Good day,${
            safe(firstName)
        } 👋
                 </h1>
                <p
                 style="font-size:0.88rem;color:var(--muted);margin:4px 0 0">Here's your academic overview.
                 </p>
            </div>
        </div>
${
            urgentCount > 0 ? `
        <div
         class="urgent-banner mb-3">
            <i class="bi bi-exclamation-triangle-fill fs-5"></i>
            <span>
            You have <strong>${
                urgentCount
            }
</strong>
 deadline${
                urgentCount > 1 ? 's' : ''
            } due within 3 days.
            </span>
            <a
             href="/calendar.html" class="ms-auto text-decoration-underline" style="color:inherit;white-space:nowrap">View Calendar →
             </a>
        </div>` : ''
        }

        <!-- Drive Banner -->
        <div
         id="driveBanner" class="drive-banner mb-4">
${
            driveBannerHTML()
        }
</div>

        <!-- Stats -->
        <div
         class="row g-3 mb-4">
            <div
             class="col-6 col-md-3">
             <div class="stat-card">
                <div
                 class="stat-label">Enrolled Courses
                 </div>
                <div
                 class="stat-value val-blue">${
            courseCount
        }
                 </div>
                <div
                 class="stat-sub">${
            safe(data.siteName)
        }
                </div>
            </div></div>
            <div
             class="col-6 col-md-3">
             <div
              class="stat-card">
                <div
                 class="stat-label">Urgent Deadlines
                 </div>
                <div
                 class="stat-value val-red">${
            urgentCount
        }</div>
                <div
                 class="stat-sub">Due within 3 days
                 </div>
            </div></div>
            <div
             class="col-6 col-md-3">
             <div
              class="stat-card">
                <div
                 class="stat-label">Upcoming Events
                 </div>
                <div
                 class="stat-value val-green">${
            eventCount
        }
                 </div>
                <div
                 class="stat-sub">Next 14 days
                 </div>
            </div></div>
            <div
             class="col-6 col-md-3">
             <div
              class="stat-card">
                <div
                 class="stat-label">Quizzes Ahead
                 </div>
                <div
                 class="stat-value val-purple">${
            quizCount
        }
                 </div>
                <div
                 class="stat-sub">Next 14 days
                 </div>
            </div></div>
        </div>

        <!-- Quick Actions -->
        <div
         class="quick-actions">
            <a
             href="/calendar.html"   class="action-btn">📅 Calendar
             </a>
            <a
             href="/summarizer.html" class="action-btn">🤖 Summarizer
             </a>
            <button
             class="action-btn" onclick="downloadAllCourses()">⬇️ Download All Courses
             </button>
            <button
             class="action-btn" onclick="renderPage(dashData)">🔄 Refresh
             </button>
        </div>

        <!-- Two-column layout -->
        <div
         class="row g-4">
            <!-- Courses (left, wider) -->
            <div
             class="col-12 col-lg-7">
                <div
                 class="section-card">
                    <div
                     class="section-head">
                        <h2>
                        <i class="bi bi-journals me-2"></i>
                        Enrolled Courses
                        </h2>
                        <span
                         class="head-badge" id="courseCountBadge">${
            courseCount
        } courses
                         </span>
                    </div>
                    <div
                     id="courseList">
                        ${
            data.courses.length === 0
            ? '<div' +
                ' class="empty-msg">No enrolled courses found.' +
                '</div>'
            : data.courses.map(c => buildCourseRow(c)).join('')
        }
                    </div>
                </div>
            </div>

            <!-- Deadlines (right) -->
            <div
             class="col-12 col-lg-5">
                <div
                 class="section-card">
                    <div
                     class="section-head">
                        <h2>
                        <i class="bi bi-alarm me-2"></i>Upcoming Deadlines
                        </h2>
                        <a
                         href="/calendar.html" style="font-size:0.78rem;color:var(--accent);text-decoration:none">View all →
                         </a>
                    </div>
                    ${
            data.upcomingEvents.length === 0
            ? '<div' +
                ' class="empty-msg">No deadlines in the next 14 days 🎉' +
                '</div>'
            : data.upcomingEvents.map(e => {
                const days = Math.ceil(e.timeUntilDue / 86400);
                const label = days <= 0 ? 'Today' : days === 1 ? 'Tomorrow' : days + 'd';
                return `<div
 class="deadline-item">
                                <div
                                 class="dl-dot" style="background:${
                    e.color
                }">
</div>
                                <div
                                 style="flex:1;min-width:0">
                                    <div
                                     class="dl-title">${
                    safe(e.title)
                }
                                     </div>
                                    <div
                                     class="dl-course">${
                    safe(e.courseName)
                }
                                     </div>
                                </div>
                                <span
                                 class="dl-when" style="background:${
                    e.color
                }">${
                    label
                }
                                 </span>
                            </div>`;
            }
            ).join('')
        }
                </div>
            </div>
        </div>`;
    }

    //  Course Row Builder
    function buildCourseRow(c) {
        if (!courseState[c.id]) {
            courseState[c.id] = {
                open: false, filesLoaded: false, weeksLoaded: false, activeWeek: 0, files: [], weeks: []
            };
        }
        return `
    <div
     class="course-row" id="cr-${
            c.id
        }">
        <div
         class="course-header" onclick="toggleCourse(${
            c.id
        }, '${
            safe(c.shortName)
        }')">
            <i class="bi bi-chevron-right course-chevron" id="chev-${
            c.id
        }"></i>
            <div
             style="flex:1;min-width:0">
                <div
                 class="course-name">${
            safe(c.fullName)
        }
                 </div>
                <div
                 class="course-code">${
            safe(c.shortName)
        }
                 </div>
            </div>
            <div
             class="course-actions" onclick="event.stopPropagation()">
                <button
                 class="btn-sm-action primary" id="dlbtn-${
            c.id
        }"
                        onclick="downloadCourse(${
            c.id
        }, '${
            safe(c.shortName)
        }')">
                    <i class="bi bi-download"></i> Download
                </button>
                ${
            driveStatus.authorized ? `
                <button class="btn-sm-action drive" id="drivebtn-${
                c.id
            }"
                        onclick="uploadToDrive('${
                safe(c.shortName)
            }', ${
                c.id
            })">
                    <i class="bi bi-cloud-upload"></i> Drive
                </button>` : ''
        }
            </div>
        </div>
        <div
         class="course-panel" id="panel-${
            c.id
        }">
</div>
    </div>`;
    }

    //  Toggle / Expand Course
    async function toggleCourse(courseId, shortName) {
        const state  = courseState[courseId];
        const panel  = document.getElementById('panel-' + courseId);
        const chev   = document.getElementById('chev-' + courseId);

        state.open = !state.open;
        panel.classList.toggle('open', state.open);
        chev.classList.toggle('open', state.open);

        if (!state.open) return;

        // Load files + weeks on first open
        if (!state.weeksLoaded) {
            panel.innerHTML = '' +
                '<div' +
                ' class="loading-row">' +
                '<span' +
                ' class="spinner-sm me-2">' +
                '</span>' +
                'Loading course contents...' +
                '</div>';
            await loadCourseContents(courseId, shortName);
        }
    }

    async function loadCourseContents(courseId, shortName) {
        const state = courseState[courseId];

        try {
            // Fetch weekly sections and flat file list in parallel
            const [weeksRes, filesRes] = await Promise.all([
                fetch(`/api/courses/${
                    courseId
                }/weeks?shortName=${
                    encodeURIComponent(shortName)
                }`),
                fetch(`/api/courses/${
                    courseId
                }/files`)
            ]);

            state.weeks = weeksRes.ok ? await weeksRes.json() : [];
            state.files = filesRes.ok ? await filesRes.json() : [];
            state.weeksLoaded = true;
            state.filesLoaded = true;

        } catch (e) {
            document.getElementById('panel-' + courseId).innerHTML =
                `<div
 class="empty-msg" style="color:var(--red)">Failed to load: ${
                safe(e.message)
            }
 </div>`;
            return;
        }

        renderCoursePanel(courseId, shortName);
    }


    //  Render Course Panel (tabs + file list)
    function renderCoursePanel(courseId, shortName) {
        const state = courseState[courseId];
        const panel = document.getElementById('panel-' + courseId);

        if (state.weeks.length === 0 && state.files.length === 0) {
            panel.innerHTML = '<div' +
                ' class="empty-msg">No downloadable files found in this course.' +
                '</div>';
            return;
        }

        // Build "All Files" + per-week tabs
        let tabsHTML = `<div
 class="week-tab active" onclick="switchTab(${
            courseId
        },'${
            safe(shortName)
        }' +
  '',-1,this)"
                         id="tab-${
            courseId
        }-all">All Files (${
            state.files.length
        })
                         </div>`;

        state.weeks.forEach((w, i) => {
            const hasFiles = w.files && w.files.length > 0;
            tabsHTML += `<div
 class="week-tab${
                hasFiles ? ' has-files' : ''
            }"
                          onclick="switchTab(${
                courseId
            },'${
                safe(shortName)
            }',${
                i
            },this)"
                          id="tab-${
                courseId
            }-${
                i
            }">
                        ${
                safe(w.sectionName || w.dateRange || 'Week ' + w.sectionNumber)
            }
                     </div>`;
        });

        const dlAllLabel = state.files.length > 0
            ? `<i class="bi bi-download me-1"></i>Download All (${
            state.files.length
        } files)`
            : `<i class="bi bi-download me-1"></i>Download All`;

        panel.innerHTML = `
        <div
         class="panel-toolbar">
            <div
             class="toolbar-left">
                <button
                 class="btn-sm-action primary" id="dlall-${
            courseId
        }"
                        onclick="downloadCourse(${
            courseId
        },'${
            safe(shortName)
        }')">
                    ${
            dlAllLabel
        }
                </button>
                <button
                 class="btn-sm-action" id="dlweek-${
            courseId
        }" style="display:none"
                        onclick="downloadActiveWeek(${
            courseId
        },'${
            safe(shortName)
        }')">
                    <i class="bi bi-download me-1"></i>Download This Week
                </button>
                ${
            driveStatus.authorized ? `
                <button
                 class="btn-sm-action drive"
                        onclick="uploadToDrive('${
                safe(shortName)
            }', ${
                courseId
            })">
                    <i class="bi bi-cloud-upload me-1"></i>Upload to Drive
                </button>` : ''}
            </div>
            <span style="font-size:0.75rem;color:var(--muted)" id="file-count-${
            courseId
        }">
                ${
            state.files.length
        } file(s)
            </span>
        </div>
        <div
         class="week-tabs">${
            tabsHTML
        }</div>
        <div
         class="file-list" id="filelist-${
            courseId
        }">
            ${
            renderFileItems(state.files)
        }
        </div>`;
    }

    //  Tab Switching
    function switchTab(courseId, shortName, weekIndex, tabEl) {
        const state = courseState[courseId];

        // Deactivate all tabs
        const container = tabEl.closest('.week-tabs');
        container.querySelectorAll('.week-tab').forEach(t => t.classList.remove('active'));
        tabEl.classList.add('active');

        state.activeWeek = weekIndex;

        const weekBtn = document.getElementById('dlweek-' + courseId);

        if (weekIndex === -1) {
            // "All Files" tab
            document.getElementById('filelist-' + courseId).innerHTML = renderFileItems(state.files);
            document.getElementById('file-count-' + courseId).textContent = state.files.length + ' file(s)';
            if (weekBtn) weekBtn.style.display = 'none';
        } else {
            const week = state.weeks[weekIndex];
            const files = week.files || [];
            document.getElementById('filelist-' + courseId).innerHTML = renderFileItems(files);
            document.getElementById('file-count-' + courseId).textContent = files.length + ' file(s) in this week';
            if (weekBtn) {
                weekBtn.style.display = files.length > 0 ? 'inline-flex' : 'none';
            }
        }
    }

    //  File Item Renderer
    function renderFileItems(files) {
        if (!files || files.length === 0)
            return '<div' +
                ' class="empty-msg" style="padding:16px">No files in this section.' +
                '</div>';

        return files.map(f => {
            const ext  = (f.fileName || '').split('.').pop().toLowerCase();
            const icon = fileIcon(ext);
            const size = formatBytes(f.fileSize || 0);
            return `
        <div
         class="file-item">
            <div
             class="file-icon ${
                icon.cls
            }">${
                icon.emoji
            }
             </div>
            <span
             class="file-name" title="${
                safe(f.fileName)
            }">${
                safe(f.fileName)
            }
             </span>
            <span
             class="file-size">${
                size
            }
             </span>
        </div>`;
        }).join('');
    }

    //  Download — Full Course
    async function downloadCourse(courseId, shortName) {
        const btn = document.getElementById('dlbtn-' + courseId)
            || document.getElementById('dlall-' + courseId);

        if (btn) {
            btn.disabled = true; btn.innerHTML = '' +
                '<span' +
                ' class="spinner-sm me-1">' +
                '</span>Downloading...';
        }

        try {
            const r = await fetch(`/api/download/${
                courseId
            }`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    shortName
                })
            });
            const d = await r.json();

            if (r.ok) {
                if (btn) {
                    btn.innerHTML = `<i class="bi bi-check-lg me-1"></i>Done (${
                        d.downloaded
                    })`; btn.classList.add('success');
                }
                showToast(`Downloaded ${
                    d.downloaded
                } file(s) from ${
                    shortName
                }.` + (d.skipped > 0 ? ` ${
                    d.skipped
                } already existed.` : ''));
            } else {
                if (btn) {
                    btn.disabled = false; btn.innerHTML = '<i class="bi bi-download me-1"></i>Retry';
                }
                showToast('Download failed: ' + (d.error || 'unknown error'), true);
            }
        } catch (e) {
            if (btn) {
                btn.disabled = false; btn.innerHTML = '<i class="bi bi-download me-1"></i>Retry';
            }
            showToast('Connection error: ' + e.message, true);
        }
    }

    //  Download — Active Week Only
    async function downloadActiveWeek(courseId, shortName) {
        const state = courseState[courseId];
        if (state.activeWeek < 0 || !state.weeks[state.activeWeek]) return;

        const week = state.weeks[state.activeWeek];
        const btn  = document.getElementById('dlweek-' + courseId);

        if (btn) {
            btn.disabled = true; btn.innerHTML = '<span' +
                ' class="spinner-sm me-1">' +
                '</span>Downloading...';
        }

        try {
            const r = await fetch(`/api/courses/${
                courseId
            }/weeks/download`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    shortName, sectionNumbers: [week.sectionNumber]
                })
            });
            const d = await r.json();

            if (r.ok) {
                if (btn) {
                    btn.innerHTML = `<i class="bi bi-check-lg me-1"></i>Done (${
                        d.downloaded
                    })`; btn.classList.add('success');
                }
                showToast(`Week downloaded: ${
                    d.downloaded
                } file(s). ${
                    d.skipped
                } skipped.`);
            } else {
                if (btn) {
                    btn.disabled = false; btn.innerHTML = '<i class="bi bi-download me-1"></i>Download This Week';
                }
                showToast(d.error || 'Week download failed.', true);
            }
        } catch (e) {
            if (btn) {
                btn.disabled = false; btn.innerHTML = '<i class="bi bi-download me-1"></i>Download This Week';
            }
            showToast(e.message, true);
        }
    }

    //  Download All Courses
    async function downloadAllCourses() {
        if (!dashData || !dashData.courses.length) return;
        showToast('Starting download for all ' + dashData.courses.length + ' courses...');
        for (const c of dashData.courses) {
            await downloadCourse(c.id, c.shortName);
        }
        showToast('All course downloads finished!');
    }

    //  Google Drive
    function driveBannerHTML() {
        if (!driveStatus.configured) {
            return `<div
 class="drive-dot unconfigured">
</div>
                <div
                 style="flex:1">
                    <span
                     style="font-weight:600;font-size:0.88rem">Google Drive not configured
                     </span>
                    <div
                     style="font-size:0.78rem;color:var(--muted);margin-top:2px">
                        Add <code>
                        credentials.json
                        </code> to <code>
                        src/main/resources/
                        </code> to enable cloud backup.
                    </div>
                </div>`;
        }
        if (!driveStatus.authorized) {
            return `<div
 class="drive-dot disconnected">
</div>
                <div
                 style="flex:1">
                    <span
                     style="font-weight:600;font-size:0.88rem">Google Drive not connected
                     </span>
                    <div
                     style="font-size:0.78rem;color:var(--muted);margin-top:2px">Connect once to back up your downloads to Drive.
                     </div>
                </div>
                <button
                 class="btn-sm-action drive" onclick="connectDrive()">
                    <i class="bi bi-google me-1"></i>Connect Drive
                </button>`;
        }
        return `<div
 class="drive-dot connected">
</div>
            <div
             style="flex:1">
                <span
                 style="font-weight:600;font-size:0.88rem;color:var(--green)">Google Drive connected
                 </span>
                <div
                 style="font-size:0.78rem;color:var(--muted);margin-top:2px">Your downloads can be synced to Drive from each course panel.
                 </div>
            </div>
            <button
             class="btn-sm-action" style="color:var(--red);border-color:var(--red)" onclick="disconnectDrive()">
                <i class="bi bi-x-circle me-1"></i>Disconnect
            </button>`;
    }

    async function connectDrive() {
        showToast('Opening Google sign-in... check your browser.');
        try {
            const r = await fetch('/api/drive/connect', {
                method: 'POST'
            });
            const d = await r.json();
            if (r.ok) {
                driveStatus.authorized = true;
                document.getElementById('driveBanner').innerHTML = driveBannerHTML();
                showToast('Google Drive connected successfully!');
                // Refresh to show Drive buttons on course rows
                renderPage(dashData);
            } else {
                showToast(d.error || 'Failed to connect Drive.', true);
            }
        } catch (e) {
            showToast('Connection error: ' + e.message, true);
        }
    }

    async function disconnectDrive() {
        try {
            await fetch('/api/drive/disconnect', {
                method: 'POST'
            });
            driveStatus.authorized = false;
            document.getElementById('driveBanner').innerHTML = driveBannerHTML();
            showToast('Google Drive disconnected.');
            renderPage(dashData);
        } catch (e) {
            showToast(e.message, true);
        }
    }

    async function uploadToDrive(shortName, courseId) {
        const btn = document.getElementById('drivebtn-' + courseId);
        if (btn) {
            btn.disabled = true; btn.innerHTML = '<span' +
                ' class="spinner-sm me-1">' +
                '</span>Uploading...';
        }

        try {
            const r = await fetch(`/api/drive/upload/${
                encodeURIComponent(shortName)
            }`, {
                method: 'POST'
            });
            const d = await r.json();
            if (r.ok) {
                if (btn) {
                    btn.innerHTML = `<i class="bi bi-cloud-check me-1"></i>Synced (${
                        d.uploaded
                    })`; btn.classList.add('success');
                }
                showToast(d.message || `Uploaded ${
                    d.uploaded
                } file(s) to Drive.`);
            } else {
                if (btn) {
                    btn.disabled = false; btn.innerHTML = '<i class="bi bi-cloud-upload me-1"></i>Drive';
                }
                showToast(d.error || 'Drive upload failed.', true);
            }
        } catch (e) {
            if (btn) {
                btn.disabled = false; btn.innerHTML = '<i class="bi bi-cloud-upload me-1"></i>Drive';
            }
            showToast(e.message, true);
        }
    }

    //  Utilities
    function fileIcon(ext) {
        const map = {
            pdf:  {
                cls: 'icon-pdf',  emoji: '📄'
            },
            pptx: {
                cls: 'icon-pptx', emoji: '📊'
            },
            ppt:  {
                cls: 'icon-pptx', emoji: '📊'
            },
            docx: {
                cls: 'icon-docx', emoji: '📝'
            },
            doc:  {
                cls: 'icon-docx', emoji: '📝'
            },
            zip:  {
                cls: 'icon-zip',  emoji: '🗜'
            },
            rar:  {
                cls: 'icon-zip',  emoji: '🗜'
            },
            mp4:  {
                cls: 'icon-mp4',  emoji: '🎬'
            },
            xlsx: {
                cls: 'icon-xlsx', emoji: '📈'
            },
            xls:  {
                cls: 'icon-xlsx', emoji: '📈'
            },
        };
        return map[ext] || {
            cls: 'icon-file', emoji: '📎'
        };
    }

    function formatBytes(b) {
        if (!b || b === 0) return '—';
        if (b < 1024)           return b + ' B';
        if (b < 1024 * 1024)    return (b / 1024).toFixed(1) + ' KB';
        return (b / (1024 * 1024)).toFixed(1) + ' MB';
    }

    function safe(s) {
        if (!s) return '';
        return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
    }

    function showError(msg) {
        document.getElementById('pageContent').innerHTML = `
    <div
     class="center-screen">
        <i class="bi bi-exclamation-circle" style="font-size:2rem;color:var(--red)"></i>
        <p
         style="color:var(--red)">${
            safe(msg)
        }
         </p>
        <button
         class="btn-sm-action primary" onclick="location.reload()">Retry
         </button>
    </div>`;
    }

    let _toast;
    function showToast(msg, isErr = false) {
        const el = document.getElementById('toast');
        el.textContent = msg;
        el.style.borderColor = isErr ? 'var(--red)' : 'var(--border-color)';
        el.classList.add('show');
        clearTimeout(_toast);
        _toast = setTimeout(() => el.classList.remove('show'), 3500);
    }

    async function logout() {
        await fetch('/api/auth/logout', {
            method: 'POST'
        });
        window.location.href = '/index.html';
    }
</script>
</body>
</html>
